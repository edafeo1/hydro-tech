AWSTemplateFormatVersion: '2010-09-09'
Description: Hydro-Tec static website — private S3 origin, CloudFront OAC, multi-page routing and optional GitHub staging deployment.

Parameters:
  CustomDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.-]+[.][a-z]{2,63}$'
    Description: Optional canonical hostname. Leave empty to use the CloudFront hostname.
  AlternateDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.-]+[.][a-z]{2,63}$'
    Description: Optional second hostname, such as www. Certificate must cover both names.
  EnableIndexing:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only after the business domain and production content are verified.
  CertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-fA-F0-9-]+$'
    Description: For a custom hostname, an issued ACM certificate in us-east-1 covering that hostname.
  EnableGitHubDeployment:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true for the staging stack to create a deployment role for edafeo1/noxy.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'
    Description: Reuse an existing GitHub OIDC provider in this AWS account. Leave empty only if none exists.
  GitHubOidcSubject:
    Type: String
    Default: 'repo:edafeo1@20019420/noxy@1438595013:environment:staging'
    AllowedPattern: '^repo:[^*?]+:environment:staging$'
    Description: Exact OIDC subject for this repository and staging environment. Default matches this repository's immutable IDs; no wildcards.

Rules:
  AlternateDomainRequiresCanonical:
    RuleCondition: !Not [!Equals [!Ref AlternateDomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CustomDomainName, '']]
        AssertDescription: A second hostname requires a canonical hostname.
  CustomDomainRequiresCertificate:
    RuleCondition: !Not [!Equals [!Ref CustomDomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: Supply an issued us-east-1 ACM certificate for the custom domain.

Conditions:
  HasAlternateDomain: !Not [!Equals [!Ref AlternateDomainName, '']]
  IndexingEnabled: !Equals [!Ref EnableIndexing, 'true']
  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  GitHubDeploymentEnabled: !Equals [!Ref EnableGitHubDeployment, 'true']
  HasExistingGitHubProvider: !Not [!Equals [!Ref ExistingGitHubOidcProviderArn, '']]
  CreateGitHubProvider: !And
    - !Condition GitHubDeploymentEnabled
    - !Not [!Condition HasExistingGitHubProvider]

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: hydrotec-website

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3-access'
        Description: Signed read access from this CloudFront distribution to the website bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-directory-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve actual multi-page directory index files without an SPA fallback.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var canonical = '${CustomDomainName}';
          var clean = uri.replace(/\/index\.html$/, '/');
          if (!clean.endsWith('/') && !clean.split('/').pop().includes('.')) clean += '/';
          if ((canonical && request.headers.host.value !== canonical) || clean !== uri) {
            var query = [];
            Object.keys(request.querystring || {}).forEach(function (key) {
              var entry = request.querystring[key];
              (entry.multiValue || [entry]).forEach(function (value) {
                query.push(encodeURIComponent(key) + '=' + encodeURIComponent(value.value));
              });
            });
            return {statusCode: 301, statusDescription: 'Moved Permanently', headers: {
              location: {value: 'https://' + (canonical || request.headers.host.value) + clean + (query.length ? '?' + query.join('&') : '')}
            }};
          }
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static-cache'
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-response-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
              Override: true
            - Header: X-Robots-Tag
              Value: !If [IndexingEnabled, 'all', 'noindex, nofollow']
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Hydro-Tec multi-page website
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Aliases: !If
          - HasCustomDomain
          - !If [HasAlternateDomain, [!Ref CustomDomainName, !Ref AlternateDomainName], [!Ref CustomDomainName]]
          - !Ref 'AWS::NoValue'
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: WebsiteS3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: WebsiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 30
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 30

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireSecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WebsiteBucket.Arn
              - !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: hydrotec-website

  GitHubStagingRole:
    Type: AWS::IAM::Role
    Condition: GitHubDeploymentEnabled
    Properties:
      Description: Upload Hydro-Tec staging files and invalidate only its CloudFront distribution.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - HasExistingGitHubProvider
                - !Ref ExistingGitHubOidcProviderArn
                - !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOidcSubject
      Policies:
        - PolicyName: StagingWebsiteUpload
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListStagingBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: UploadStagingFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${WebsiteBucket.Arn}/*'
              - Sid: InvalidateStagingDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
      Tags:
        - Key: Project
          Value: hydrotec-website

Outputs:
  BucketName:
    Value: !Ref WebsiteBucket
  DistributionId:
    Value: !Ref Distribution
  CloudFrontDomainName:
    Value: !GetAtt Distribution.DomainName
  WebsiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  AWSRegion:
    Value: !Ref 'AWS::Region'
  GitHubStagingRoleArn:
    Condition: GitHubDeploymentEnabled
    Value: !GetAtt GitHubStagingRole.Arn
  GitHubOidcProviderArn:
    Condition: GitHubDeploymentEnabled
    Value: !If [HasExistingGitHubProvider, !Ref ExistingGitHubOidcProviderArn, !Ref GitHubOidcProvider]
