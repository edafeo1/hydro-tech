name: Build and validate website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository history for credential patterns
        run: python3 scripts/check-secrets.py --history
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate production build (no deployment)
        env:
          SITE_ORIGIN: https://hydrotecbuildingprotectiongroup.com.au
          SITE_INDEXABLE: '1'
          ENQUIRY_ENDPOINT: https://7h65rrgqo8.execute-api.ap-southeast-2.amazonaws.com/enquiries
        run: |
          npm run build
          npm run check
      - name: Build and validate staging
        env:
          SITE_ORIGIN: https://d3s90nqnvv0rq0.cloudfront.net
          SITE_INDEXABLE: '0'
          ENQUIRY_ENDPOINT: https://7h65rrgqo8.execute-api.ap-southeast-2.amazonaws.com/enquiries
          ENQUIRY_TEST_MODE: '1'
        run: |
          npm run build
          npm run check
      - name: Validate the AWS infrastructure template
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hydrotec-cfn-validation"
          "$RUNNER_TEMP/hydrotec-cfn-validation/bin/python" -m pip install --disable-pip-version-check --quiet 'cfn-lint==1.59.0'
          "$RUNNER_TEMP/hydrotec-cfn-validation/bin/cfn-lint" --template infrastructure/aws-static-site.yml infrastructure/aws-enquiries.json
          "$RUNNER_TEMP/hydrotec-cfn-validation/bin/python" -m unittest discover -s tests -p 'test_*.py'
      - name: Retain the review build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hydrotec-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
